[project]
name = "my-social-networks-api"
version = "0.1.0"
description = "API FastAPI de gestion de réseaux sociaux et d’événements"
readme = "README.md"
authors = [
    { name = "diomandiakite92-ux", email = "diomandiakite92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.1",
]

[project.scripts]
my-social-networks-api = "my_social_networks_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
